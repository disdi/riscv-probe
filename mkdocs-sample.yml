# Project information
site_name: "RISC-V Probe"
site_description: "Open two-wire debug for RISC-V soft cores. An SWD front-end for VexRiscv and VexiiRiscv."
site_author: "Saket Sinha"
site_url: "https://disdi.github.io/riscv-probe/"

# Copyright
copyright: "&copy; 2026 Saket Sinha"

# Repository
repo_name: "disdi/riscv-probe"
repo_url: "https://github.com/disdi/riscv-probe"
edit_uri: "edit/master/docs_sample/"

# Configuration
docs_dir: "docs_sample"
theme:
  name: "material"
  custom_dir: "overrides"
  language: "en"
  palette:
    primary: "blue"
    accent: "blue"
  features:
    - navigation.tabs

# Extensions
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - mdx_math:
      enable_dollar_delimiter: true
  - toc:
      permalink: true
      separator: "_"

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - en

# Customization
extra_javascript:
  - "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.6/MathJax.js?config=TeX-MML-AM_CHTML"
extra_css:
  - "assets/css/custom.css"
extra:
  social:
    - icon: "fontawesome/brands/github-alt"
      link: "https://github.com/disdi/riscv-probe"
