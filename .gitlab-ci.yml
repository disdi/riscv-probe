image:
  name: ghcr.io/peaceiris/mkdocs-material:v4.0.1

pages:
  script:
    - mkdocs build --strict --config-file ./mkdocs-sample.yml
    - test -s site/index.html
    - grep -q "Debug a RISC-V core over two pins" site/index.html
    - mv site public
  artifacts:
    paths:
      - public
  only:
    - master
    - main
